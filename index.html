<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לומדת שורשים - מורן קמיל גלברג</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f0fdf4;
            padding-top: 5rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .root-letter { color: #2563eb; font-weight: 700; }
        .affix-letter { color: #f97316; }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s ease-out forwards; }
        
        .block-none { background-color: #f3f4f6; color: #374151; border-color: #d1d5db; }
        .block-root { background-color: #dbeafe; color: #1d4ed8; border-color: #3b82f6; font-weight: 700;}
        .block-affix { background-color: #ffedd5; color: #c2410c; border-color: #f97316; }
        .tool-selected { transform: scale(1.1); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); border-width: 4px; }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center p-4 md:p-8 relative">

    <!-- Nikud Header -->
    <div class="fixed top-0 left-0 right-0 bg-white shadow-md p-3 flex justify-center items-center gap-4 z-40">
        <label class="font-bold text-gray-700 text-lg">בקרת ניקוד:</label>
        <select id="nikudSelector" onchange="changeNikud(this.value)" class="bg-blue-50 border-2 border-blue-200 rounded-full px-6 py-2 text-lg focus:outline-none focus:border-blue-400 font-medium transition-colors cursor-pointer">
            <option value="full">עם ניקוד מלא</option>
            <option value="partial">ניקוד חלקי</option>
            <option value="none">ללא ניקוד</option>
        </select>
    </div>

    <!-- App Container -->
    <div id="app" class="w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden p-6 md:p-10 animate-pop flex-grow z-10">
        <!-- Content will be injected here -->
    </div>

    <!-- Footer Credit -->
    <footer class="mt-8 text-center text-gray-500 font-medium pb-4 z-10">
        יצרה באמצעות הבינה המלאכותית- מורן קמיל גלברג, הוראה מותאמת
    </footer>

    <!-- Custom Root Modal -->
    <div id="customRootModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-pop">
            <div class="bg-blue-600 text-white p-6 relative">
                <button onclick="closeCustomModal()" class="absolute top-4 left-4 text-white hover:text-blue-200 text-3xl font-bold">&times;</button>
                <h2 class="text-3xl font-bold text-center">➕ הוספת שורש חדש</h2>
                <p class="text-center text-blue-100 mt-2">המערכת תזהה את המילים ותכין תרגולים אוטומטית!</p>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow bg-gray-50 space-y-6">
                <div>
                    <label class="block font-bold text-lg mb-2">אותיות השורש (למשל: ר.ק.ד או ח.ש.ב)</label>
                    <input type="text" id="cRootName" placeholder="הקלידו את השורש..." class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 text-xl focus:border-blue-500 outline-none">
                </div>
                
                <div>
                    <label class="block font-bold text-lg mb-2">מילות המשפחה (הפרידו בפסיק)</label>
                    <textarea id="cWords" rows="3" placeholder="רקד, רוקד, רקדן, ריקוד, הרקיד..." class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 text-lg focus:border-blue-500 outline-none"></textarea>
                </div>

                <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                    <label class="block font-bold text-lg mb-2 text-blue-800">משפטים להשלמה (אופציונלי)</label>
                    <p class="text-sm text-blue-600 mb-2">הקלידו משפט מנוקד עם קו תחתון (_), הוסיפו את הסימן | ואז את התשובה.</p>
                    <textarea id="cSentences" rows="3" placeholder="הַיֶּלֶד ___ בַּמְּסִבָּה | רָקַד&#10;הַ___ הוֹפִיעַ עַל הַבָּמָה | רַקְדָן" class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 text-lg focus:border-blue-500 outline-none"></textarea>
                </div>

                <div class="bg-purple-50 border border-purple-200 rounded-xl p-4">
                    <label class="block font-bold text-lg mb-2 text-purple-800">פעלים לתרגול זמנים וגופים (אופציונלי)</label>
                    <p class="text-sm text-purple-600 mb-2">פורמט: פועל | זמן | גוף</p>
                    <textarea id="cVerbs" rows="3" placeholder="רָקַדְתִּי | עבר | אני&#10;יִרְקְדוּ | עתיד | הם" class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 text-lg focus:border-blue-500 outline-none"></textarea>
                </div>
            </div>

            <div class="p-6 bg-white border-t flex justify-between gap-4">
                <button onclick="saveCustomRoot()" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-4 rounded-xl transition-colors shadow-md">שמור שורש חדש</button>
                <button onclick="closeCustomModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 text-xl font-bold py-4 rounded-xl transition-colors">ביטול</button>
            </div>
        </div>
    </div>

        // --- 3. Utility Functions ---
        
        function stripHTMLAndFormat(htmlStr) {
            if (!htmlStr) return '';
            let tmp = document.createElement('div');
            tmp.innerHTML = htmlStr;
            function processNode(node) {
                if (node.nodeType === 3) {
                    if (nikudMode === 'none') {
                        node.nodeValue = node.nodeValue.replace(/[\u0591-\u05C7]/g, '');
                    } else if (nikudMode === 'partial') {
                        node.nodeValue = node.nodeValue.replace(/[\u05B0-\u05B8\u05BB\u05C7]/g, '');
                    }
                } else { node.childNodes.forEach(processNode); }
            }
            processNode(tmp);
            return tmp.innerHTML;
        }

        function getRawText(htmlStr) {
            let tmp = document.createElement("div");
            tmp.innerHTML = htmlStr;
            return tmp.textContent || tmp.innerText || "";
        }

        window.changeNikud = function(mode) {
            nikudMode = mode;
            render(); 
        };

        function showFeedback(msg, type) {
            const fDiv = document.getElementById('feedbackDiv');
            if(fDiv) {
                fDiv.innerHTML = msg;
                fDiv.className = `mt-8 p-4 rounded-xl text-2xl font-bold text-center animate-pop ${type === 'positive' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
                fDiv.classList.remove('hidden');
            }
        }

        function hideFeedback() {
            const fDiv = document.getElementById('feedbackDiv');
            if(fDiv) fDiv.classList.add('hidden');
        }

        function shuffle(array) {
            return array.sort(() => 0.5 - Math.random());
        }

        function getTenQuestions(arr) {
            if(!arr || arr.length === 0) return [];
            let res = [...arr];
            while(res.length < 10) {
                res = res.concat([...arr]);
            }
            return shuffle(res).slice(0, 10);
        }

        // --- Top Navigation Menu Logic ---
        function getTaskCategories() {
            const categories = [];
            currentTaskQuestions.forEach((q, index) => {
                let catId = q.taskType === 'grammar' ? `grammar-${q.mode}` : q.taskType;
                if (!categories.find(c => c.id === catId)) {
                    categories.push({
                        id: catId,
                        name: getCategoryName(catId),
                        startIndex: index
                    });
                }
            });
            return categories;
        }

        function getCategoryName(id) {
            const names = {
                'multiVocab': '📖 אוצר מילים',
                'sentence': '✍️ משפטים',
                'oddOne': '🕵️‍♀️ יוצא דופן',
                'mark': '🖌️ סימון שורש',
                'grammar-tenses': '⏳ זמנים',
                'grammar-persons': '👤 גופים'
            };
            return names[id] || id;
        }

        // --- Custom Root Auto-Generator ---
        function getHebrewBlocks(word) {
            return word.match(/[\u0590-\u05FF][\u0591-\u05C7]*/g) || [];
        }

        function generatePatternAndHtml(word, rootLettersStr) {
            const rawRootChars = rootLettersStr.replace(/[^א-ת]/g, '').split('');
            const finalMap = {'כ':'ך', 'מ':'ם', 'נ':'ן', 'פ':'ף', 'צ':'ץ'};
            let expandedRoots = [...rawRootChars];
            rawRootChars.forEach(l => { if(finalMap[l]) expandedRoots.push(finalMap[l]); });

            let blocks = getHebrewBlocks(word);
            let html = '';
            let pattern = [];

            blocks.forEach(block => {
                let baseChar = block.replace(/[\u0591-\u05C7]/g, '');
                if (expandedRoots.includes(baseChar)) {
                    html += `<span class="root-letter">${block}</span>`;
                    pattern.push('r');
                } else {
                    html += `<span class="affix-letter">${block}</span>`;
                    pattern.push('a');
                }
            });
            return { html, pattern };
        }

        window.openCustomModal = function() { document.getElementById('customRootModal').classList.remove('hidden'); };
        window.closeCustomModal = function() {
            document.getElementById('customRootModal').classList.add('hidden');
            document.getElementById('cRootName').value = '';
            document.getElementById('cWords').value = '';
            document.getElementById('cSentences').value = '';
            document.getElementById('cVerbs').value = '';
        };

        window.saveCustomRoot = function() {
            const rootName = document.getElementById('cRootName').value.trim();
            const wordsStr = document.getElementById('cWords').value.trim();
            const sentencesStr = document.getElementById('cSentences').value.trim();
            const verbsStr = document.getElementById('cVerbs').value.trim();

            if(!rootName || !wordsStr) {
                alert('אנא הזינו את אותיות השורש ולפחות מילה אחת למשפחה.');
                return;
            }

            const cleanRootLetters = rootName.replace(/[^א-ת]/g, '');
            const wordsArrRaw = wordsStr.split(',').map(w => w.trim()).filter(Boolean);
            
            const parsedWords = wordsArrRaw.map(w => {
                const { html } = generatePatternAndHtml(w, cleanRootLetters);
                return { html: html, meaning: "מילה מותאמת אישית" };
            });

            const parsedMarking = wordsArrRaw.map(w => {
                const { pattern } = generatePatternAndHtml(w, cleanRootLetters);
                return { text: w, pattern: pattern };
            });

            const parsedSentences = [];
            if (sentencesStr) {
                sentencesStr.split('\n').forEach(line => {
                    const parts = line.split('|');
                    if (parts.length >= 2) {
                        const sText = parts[0].trim();
                        const sAnswer = parts[1].trim();
                        let options = [sAnswer];
                        const others = shuffle(wordsArrRaw.filter(w => w !== sAnswer)).slice(0, 2);
                        options.push(...others);
                        if(options.length < 3) options.push("מילה_אחרת", "עוד_מילה");
                        parsedSentences.push({ text: sText, answer: sAnswer, options: options });
                    }
                });
            }

            const parsedVerbs = [];
            if (verbsStr) {
                verbsStr.split('\n').forEach(line => {
                    const parts = line.split('|');
                    if (parts.length >= 3) {
                        const { pattern } = generatePatternAndHtml(parts[0].trim(), cleanRootLetters);
                        parsedVerbs.push({ text: parts[0].trim(), tense: parts[1].trim(), person: parts[2].trim(), pattern: pattern });
                    }
                });
            }

            const themeColor = customThemeColors[customColorIndex % customThemeColors.length];
            customColorIndex++;

            database.push({
                id: "custom_" + Date.now(),
                rootName: rootName, title: `משפחת ${rootName}`,
                themeColor: themeColor, buttonColor: "bg-gray-500 hover:bg-gray-600",
                words: parsedWords, sentences: parsedSentences, marking: parsedMarking, verbs: parsedVerbs,
                story: { title: "סִפּוּר מֻתְאָם", short: "הַסִּפּוּר אֵינוֹ זָמִין.", medium: "הַסִּפּוּר אֵינוֹ זָמִין.", long: "הַסִּפּוּר אֵינוֹ זָמִין." }
            });
            
            closeCustomModal();
            renderHome();
        };

        window.goToLearn = function(rootId) {

        // --- Unified Generator Builder - NO SHUFFLING OF TYPES ---
        window.startMixedPractice = function() {
            const selectedRootIds = Array.from(document.querySelectorAll('.gen-root-cb:checked')).map(cb => cb.value);
            const selectedTasks = Array.from(document.querySelectorAll('.gen-task-cb:checked')).map(cb => cb.value);

            if(selectedRootIds.length === 0) { alert('יש לסמן לפחות שורש אחד בוי.'); return; }
            if(selectedTasks.length === 0) { alert('יש לסמן לפחות סוג תרגול אחד בוי.'); return; }

            let finalPool = [];

            // 1. Vocab
            if(selectedTasks.includes('vocab')) {
                finalPool.push({ taskType: 'multiVocab', rootIds: selectedRootIds });
            }

            // 2. Sentence Task
            if(selectedTasks.includes('sentence')) {
                let sentences = [];
                selectedRootIds.forEach(id => {
                    const r = database.find(x => x.id === id);
                    if(r && r.sentences) sentences.push(...r.sentences.map(s => ({...s, taskType: 'sentence', sourceColor: r.themeColor})));
                });
                finalPool.push(...getTenQuestions(sentences));
            }

            // 3. Odd One Out Task
            if(selectedTasks.includes('oddOne')) {
                let oddOnes = [];
                for(let i=0; i<10; i++) {
                    const rRootId = selectedRootIds[Math.floor(Math.random() * selectedRootIds.length)];
                    const rRoot = database.find(r => r.id === rRootId);
                    
                    const otherRoots = database.filter(r => r.id !== rRoot.id);
                    if(otherRoots.length === 0) continue; 

                    const allCurrentRaw = [...(rRoot.words||[]).map(w=>getRawText(w.html)), ...(rRoot.sentences||[]).map(s=>getRawText(s.answer))];
                    if(allCurrentRaw.length === 0) continue;

                    const uniqueCurrent = [...new Set(allCurrentRaw)].sort(() => 0.5 - Math.random()).slice(0, 3);
                    const randomOtherRoot = otherRoots[Math.floor(Math.random() * otherRoots.length)];
                    const allOtherRaw = [...(randomOtherRoot.words||[]).map(w=>getRawText(w.html)), ...(randomOtherRoot.sentences||[]).map(s=>getRawText(s.answer))];
                    if(allOtherRaw.length === 0) continue;

                    const oddWord = allOtherRaw[Math.floor(Math.random() * allOtherRaw.length)];
                    let options = [...uniqueCurrent.map(w => ({text: w, isCorrect: false})), {text: oddWord, isCorrect: true}];
                    
                    oddOnes.push({
                        taskType: 'oddOne',
                        options: shuffle(options),
                        targetRootName: rRoot.rootName,
                        sourceColor: rRoot.themeColor
                    });
                }
                finalPool.push(...oddOnes);
            }

            // 4. Marking Task
            if(selectedTasks.includes('mark')) {
                let marks = [];
                selectedRootIds.forEach(id => {
                    const r = database.find(x => x.id === id);
                    if(r && r.marking) marks.push(...r.marking.map(m => ({...m, taskType: 'mark', sourceColor: r.themeColor, rootBtn: r.buttonColor})));
                });
                finalPool.push(...getTenQuestions(marks));
            }

            // 5. Tenses Task
            if(selectedTasks.includes('tenses')) {
                let verbs = [];
                selectedRootIds.forEach(id => {
                    const r = database.find(x => x.id === id);
                    if(r && r.verbs) verbs.push(...r.verbs.map(v => ({...v, taskType: 'grammar', mode: 'tenses', sourceColor: r.themeColor})));
                });
                finalPool.push(...getTenQuestions(verbs));
            }

            // 6. Persons Task
            if(selectedTasks.includes('persons')) {
                let verbs = [];
                selectedRootIds.forEach(id => {
                    const r = database.find(x => x.id === id);
                    if(r && r.verbs) verbs.push(...r.verbs.map(v => ({...v, taskType: 'grammar', mode: 'persons', sourceColor: r.themeColor})));
                });
                finalPool.push(...getTenQuestions(verbs));
            }

            if(finalPool.length === 0) {
                alert('לא נמצאו שאלות עבור סוגי התרגול שנבחרו. נסו בחירה אחרת.'); return;
            }

            currentTaskQuestions = finalPool;
            currentTaskIndex = 0;
            grammarPhase = 1;
            
            navigate('runningTask');
        }

        // --- Task Runner ---
        function renderNextTask() {
            if (currentTaskIndex >= currentTaskQuestions.length) {
                return navigate('finish');
            }

            const task = currentTaskQuestions[currentTaskIndex];
            
            if (task.taskType === 'multiVocab') renderMultiVocab(task);
            else if (task.taskType === 'sentence') renderSentenceCore(task);
            else if (task.taskType === 'oddOne') renderOddOneCore(task);
            else if (task.taskType === 'grammar') renderGrammarCore(task);
            else if (task.taskType === 'mark') renderMarkCore(task);
        }

        function buildTaskHeader(title) {
            const categories = getTaskCategories();

                    <div id="feedbackDiv" class="hidden mt-6"></div>
                </div>
            `;
            appDiv.innerHTML = html;
        }

        window.selectTool = function(tool) { selectedMarkingTool = tool; renderNextTask(); }
        window.applyColor = function(index) { userMarkingPattern[index] = selectedMarkingTool; renderNextTask(); }

        window.checkMarking = function() {
            const task = currentTaskQuestions[currentTaskIndex];
            let isCorrect = true;
            const userMapped = userMarkingPattern.map(c => c === 'root' ? 'r' : (c === 'affix' ? 'a' : 'n'));
            for (let i = 0; i < Math.min(userMapped.length, task.pattern.length); i++) {
                if (userMapped[i] !== task.pattern[i]) { isCorrect = false; break; }
            }
            if(isCorrect) {
                document.getElementById('checkMarkBtn').classList.add('hidden');
                showFeedback('מעולה! 🎉 צבעת נכון.', 'positive');
                setTimeout(() => { currentTaskIndex++; userMarkingPattern = []; renderNextTask(); }, 1500);
            } else {
                showFeedback('נסה שוב! בדוק אילו אותיות נשארות תמיד (שורש) ואילו משתנות. 🤔', 'negative');
                setTimeout(() => hideFeedback(), 2500);
            }
        }

        function renderGrammarCore(task) {
            const rawText = stripHTMLAndFormat(task.text);
            const isTenseMode = task.mode === 'tenses';
            const title = isTenseMode ? "תרגול זמנים" : "תרגול גופים";
            const questionText = isTenseMode ? "באיזה זמן המילה נמצאת?" : "באיזה גוף המילה נמצאת?";
            
            let options = isTenseMode ? ["עבר", "הווה", "עתיד"] : [];
            if (!isTenseMode) {
                const allPersons = ["אני", "אתה", "את", "הוא (זכר)", "היא (נקבה)", "אנחנו", "אתם", "אתן", "הם", "הן"];
                options = shuffle(allPersons.filter(p => p !== task.person)).slice(0, 3);
                options.push(task.person);
                options = shuffle(options);
            }

            currentWordBlocks = getHebrewBlocks(rawText);
            if(userMarkingPattern.length !== currentWordBlocks.length) userMarkingPattern = new Array(currentWordBlocks.length).fill('none');

            let html = `
                <div class="animate-pop w-full max-w-3xl mx-auto">
                    ${buildTaskHeader(title)}
            `;

            // THE NEW SMART TIP ABOUT NIKUD
            if (isTenseMode) {
                const tipHtml = `
                    <div class="bg-amber-100 border border-amber-300 text-amber-900 px-4 py-3 rounded-xl mb-6 text-center shadow-sm">
                        <strong class="text-amber-800 block mb-1 md:text-lg">💡 טיפ חשוב: שימו לב לניקוד!</strong> 
                        מילים כמו <strong>נִשְׁמַע</strong> (בפתח) הן בדרך כלל ב<strong>עתיד</strong> (מחר אנחנו נשמע).<br>
                        אבל מילים כמו <strong>נִשְׁמָע</strong> (בקמץ) הן ב<strong>הווה</strong> (השיר נשמע עכשיו).<br>
                        הקפידו לקרוא את הניקוד כדי לזהות את הזמן הנכון.
                    </div>
                `;
                html += stripHTMLAndFormat(tipHtml);
            }

            html += `
                    <div class="text-center mb-8">
                        <span class="inline-block bg-blue-50 border-2 border-blue-200 text-blue-900 text-5xl font-bold py-4 px-8 rounded-2xl shadow-sm">
                            ${rawText}
                        </span>
                    </div>
            `;

            if (grammarPhase === 1) {
                html += `
                    <p class="text-xl text-center mb-6 text-gray-700 font-medium">${stripHTMLAndFormat(questionText)}</p>
                    <div class="grid grid-cols-2 gap-4 max-w-lg mx-auto" id="grammarOptions">
                `;
                options.forEach((opt, idx) => {
                    html += `<button onclick="checkGrammarChoice('${opt}', 'opt-${idx}')" id="opt-${idx}" class="text-2xl font-bold bg-white border-2 border-gray-300 rounded-xl py-4 hover:bg-gray-50 transition-all">${stripHTMLAndFormat(opt)}</button>`;
                });
                html += `</div><div id="feedbackDiv" class="hidden mt-6"></div></div>`;
            } else {
                html += `
                    <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-8 text-center text-green-800 font-bold text-xl animate-pop">
                        מצוין! התשובה: ${stripHTMLAndFormat(isTenseMode ? task.tense : task.person)}.
                    </div>
                    <p class="text-xl text-center mb-6 text-gray-700">עכשיו <strong>סמנו בכתום</strong> רק את האותיות המרמזות על ה${isTenseMode ? 'זמן' : 'גוף'} (המוספיות)!</p>
                    <div class="flex justify-center items-center flex-row-reverse gap-2 mb-10" dir="ltr">
                `;
                currentWordBlocks.forEach((block, idx) => {
                    const userColor = userMarkingPattern[idx] === 'affix' ? 'affix' : 'none';
                    html += `<button onclick="toggleGrammarAffix(${idx})" class="text-5xl font-bold w-16 h-20 rounded-lg border-4 transition-colors block-${userColor}">${block}</button>`;
                });
                html += `
                    </div>
                    <div class="text-center">
                        <button onclick="checkGrammarMarking()" class="bg-orange-500 hover:bg-orange-600 text-white px-10 py-4 rounded-full font-bold text-xl shadow-md transition-colors">בדוק סימון!</button>
                    </div>
                    <div id="feedbackDiv" class="hidden mt-6"></div></div>
                `;
            }
            appDiv.innerHTML = html;
        }

        window.checkGrammarChoice = function(selected, btnId) {
            const task = currentTaskQuestions[currentTaskIndex];
            const isTenseMode = task.mode === 'tenses';
            const correctAnswer = isTenseMode ? task.tense : task.person;
            const btn = document.getElementById(btnId);

            if (selected === correctAnswer) {
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600');
                document.getElementById('grammarOptions').style.pointerEvents = 'none';
                setTimeout(() => { grammarPhase = 2; renderNextTask(); }, 800);
            } else {
                btn.classList.add('bg-red-500', 'text-white', 'border-red-600');
                showFeedback('נסה שוב! 🤔', 'negative');
                setTimeout(() => { btn.classList.remove('bg-red-500', 'text-white', 'border-red-600'); hideFeedback(); }, 1200);
            }
        };

        window.toggleGrammarAffix = function(index) {
            userMarkingPattern[index] = userMarkingPattern[index] === 'affix' ? 'none' : 'affix';
            renderNextTask();
        };

        window.checkGrammarMarking = function() {
            const task = currentTaskQuestions[currentTaskIndex];
            let isCorrect = true;
            for (let i = 0; i < task.pattern.length; i++) {
                if ((task.pattern[i] === 'a') !== (userMarkingPattern[i] === 'affix')) { isCorrect = false; break; }
            }

            if(isCorrect) {
                showFeedback('מעולה! 🎉 זיהית את אותיות המוספית.', 'positive');
                setTimeout(() => { grammarPhase = 1; userMarkingPattern = []; currentTaskIndex++; renderNextTask(); }, 1500);
            } else {
                showFeedback('נסה שוב! בדוק שסימנת רק את האותיות המרמזות (ולא את השורש).', 'negative');
                setTimeout(() => hideFeedback(), 2500);
            }
        };

        // --- View Specific Roots (Learning Mode) ---
        function renderVocab() {
            const root = database.find(r => r.id === activeRootId);
            let html = `
                <div class="animate-pop w-full max-w-4xl mx-auto">
                    <button onclick="navigate('home')" class="mb-6 text-gray-500 hover:text-gray-800 font-medium flex items-center gap-2">
                        <span>&rarr;</span> חזרה לתפריט
                    </button>
                    
                    <div class="flex flex-col items-center mb-8 gap-4">
                        <h2 class="text-4xl font-bold text-gray-800">${stripHTMLAndFormat('בנק המילים: ' + root.rootName)}</h2>
                        <button onclick="navigate('story')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-6 py-2 rounded-full font-bold transition-colors">
                            📖 מעבר לקריאת סיפור
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;
            root.words.forEach(word => {
                html += `
                    <div class="bg-white border-2 border-gray-100 rounded-xl p-6 flex flex-col items-center justify-center shadow-sm card-hover">
                        <div class="text-4xl mb-4 font-bold whitespace-nowrap bg-gray-50 px-6 py-4 rounded-xl border border-gray-200" dir="rtl">
                            ${stripHTMLAndFormat(word.html)}
                        </div>
                        <div class="text-lg text-gray-600 text-center font-medium">${stripHTMLAndFormat(word.meaning)}</div>
                    </div>
                `;
            });
            html += `</div></div>`;
            appDiv.innerHTML = html;
        }

        function renderStory() {
            const root = database.find(r => r.id === activeRootId);
            const story = root.story;
            
            let html = `
                <div class="animate-pop w-full max-w-3xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="navigate('home')" class="text-gray-500 hover:text-gray-800 font-medium flex items-center gap-2"><span>&rarr;</span> חזרה לתפריט</button>
                        <button onclick="navigate('vocab')" class="text-blue-500 hover:text-blue-700 font-medium">חזרה לבנק המילים</button>
                    </div>
                    <h2 class="text-3xl font-bold text-center mb-6">${stripHTMLAndFormat('קריאה: ' + story.title)}</h2>
                    <div class="flex justify-center gap-2 mb-6">
                        <button onclick="changeStoryLength('short')" class="px-4 py-2 rounded-lg font-bold border-2 ${selectedStoryLength === 'short' ? 'bg-amber-400 border-amber-500 text-white' : 'bg-gray-100 border-gray-200 text-gray-600'}">קצר</button>
                        <button onclick="changeStoryLength('medium')" class="px-4 py-2 rounded-lg font-bold border-2 ${selectedStoryLength === 'medium' ? 'bg-amber-400 border-amber-500 text-white' : 'bg-gray-100 border-gray-200 text-gray-600'}">בינוני</button>
                        <button onclick="changeStoryLength('long')" class="px-4 py-2 rounded-lg font-bold border-2 ${selectedStoryLength === 'long' ? 'bg-amber-400 border-amber-500 text-white' : 'bg-gray-100 border-gray-200 text-gray-600'}">ארוך</button>
                    </div>
                    <div class="bg-amber-50 border-2 border-amber-100 rounded-2xl p-8 mb-8 shadow-inner min-h-[200px]">
                        <p class="text-2xl leading-loose font-medium text-gray-800 text-center" id="storyContent">
                            ${stripHTMLAndFormat(story[selectedStoryLength])}
                        </p>
                    </div>
                </div>
            `;
            appDiv.innerHTML = html;
        }
        window.changeStoryLength = function(len) { selectedStoryLength = len; renderStory(); }

        // Finish Screen
        function renderFinish() {
            let html = `
                <div class="text-center animate-pop py-10">
                    <div class="text-7xl mb-6">🏆</div>
                    <h2 class="text-4xl font-bold text-green-600 mb-4">סיימת את התרגול בהצלחה!</h2>
                    <p class="text-xl mb-8 text-gray-600">כל הכבוד על המאמץ.</p>
                    <button onclick="navigate('home')" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-full font-bold text-xl transition-all shadow-md">
                        חזרה למסך הראשי
                    </button>
                </div>
            `;
            appDiv.innerHTML = html;
        }

        // Navigation
        window.navigate = function(screenName) {
            currentScreen = screenName;
            render();
        };

        // --- Start App ---
        render();

    </script>
</body>
</html>
